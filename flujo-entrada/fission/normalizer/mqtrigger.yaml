# Validado contra Fission con kind KEDA + NATS JetStream del cluster.
apiVersion: fission.io/v1
kind: MessageQueueTrigger
metadata:
  name: normalizer-mq
  namespace: default
spec:
  functionref:
    type: Function
    name: normalizer
  messageQueueType: nats-jetstream
  mqtkind: keda
  topic: scraper.mercadona.raw
  responseTopic: ""
  errorTopic: ""
  contentType: application/json
  maxRetries: 3
  minReplicaCount: 0
  maxReplicaCount: 3
  metadata:
    natsServer: nats://nats.messaging.svc.cluster.local:4222
    stream: SCRAPERS
    consumer: normalizer
    lagThreshold: "10"
