# BORRADOR: validar contra la version Fission del cluster.
# Fission soporta nats-streaming historicamente; JetStream puro puede
# requerir KEDA ScaledObject en vez de MessageQueueTrigger.
apiVersion: fission.io/v1
kind: MessageQueueTrigger
metadata:
  name: normalizer-mq
  namespace: default
spec:
  functionref:
    type: Function
    name: normalizer
  messageQueueType: nats-streaming
  topic: mercadona.raw
  responseTopic: ""
  contentType: application/json
  maxRetries: 3
  minReplicaCount: 0
  maxReplicaCount: 3
