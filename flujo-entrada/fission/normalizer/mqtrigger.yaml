# BLOQUEADO 15/10: conector keda-nats-jetstream-http-connector:v0.12 no supera
# la auth interna del router Fission v1.27 (401 en router-internal:8889).
# Puente activo: Deployment normalizer-consumer (consumer.py) en su lugar.
apiVersion: fission.io/v1
kind: MessageQueueTrigger
metadata:
  name: normalizer-mq
  namespace: default
spec:
  functionref:
    type: Function
    name: normalizer
  messageQueueType: nats-jetstream
  mqtkind: keda
  topic: scraper.mercadona.raw
  responseTopic: ""
  errorTopic: ""
  contentType: application/json
  maxRetries: 3
  minReplicaCount: 0
  maxReplicaCount: 3
  metadata:
    natsServer: nats://nats.messaging.svc.cluster.local:4222
    stream: SCRAPERS
    consumer: normalizer
    lagThreshold: "10"
