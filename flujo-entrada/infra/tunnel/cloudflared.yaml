# Cloudflare Tunnel con nombre (cuenta del equipo) que publica la API con el dominio propio.
#
# Dos valores salen del panel de Cloudflare (Zero Trust > Networks > Tunnels > el tunel):
#   - el token del tunel: va en el Secret `cloudflared-token` (clave TUNNEL_TOKEN), que
#     crea tunnel-up.sh con `TUNNEL_TOKEN=<token> bash tunnel-up.sh`. NO lo pongas en este
#     fichero: el repositorio es publico y con el token cualquiera puede conectar
#     conectores al tunel y quedarse con su trafico;
#   - superahorro/hostname: el hostname publico del tunel (anotacion, mas abajo).
# En el panel, ese hostname debe apuntar a http://api.api.svc.cluster.local:80: es Cloudflare
# quien enruta; la anotacion solo la usa tunnel-up.sh para dar la URL y probar /health.
#
# A diferencia del quick tunnel:
#   - la URL es fija: no cambia al reiniciar el pod o la VM;
#   - admite varias replicas: todas se registran en el mismo tunel y Cloudflare reparte
#     entre ellas, asi que un pod caido no deja la API sin servicio.
# El tunel sale de la VM hacia Cloudflare (no abre puertos de entrada), por eso funciona
# aunque a la VM solo se llegue por la VPN.
#
# Lo aplica tunnel-up.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: api
  labels:
    app: cloudflared
  annotations:
    superahorro/hostname: "api.superahorro.app"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # cloudflared lee el token de TUNNEL_TOKEN (Secret creado por tunnel-up.sh).
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: cloudflared-token, key: TUNNEL_TOKEN}
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
