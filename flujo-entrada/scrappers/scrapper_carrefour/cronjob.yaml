
apiVersion: batch/v1

kind: CronJob

metadata:

  name: scrapper-carrefour

  namespace: scrappers

spec:

  schedule: "*/30 * * * *"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 2

  failedJobsHistoryLimit: 2

  jobTemplate:

    spec:

      backoffLimit: 2

      template:

        spec:

          restartPolicy: OnFailure

          containers:

            - name: scraper

              image: scrapper-carrefour:v1

              imagePullPolicy: IfNotPresent

              envFrom:

                - secretRef:

                    name: scraper-secrets

              resources:

                requests: { cpu: "100m", memory: "128Mi" }

                limits:   { cpu: "500m", memory: "512Mi" }

