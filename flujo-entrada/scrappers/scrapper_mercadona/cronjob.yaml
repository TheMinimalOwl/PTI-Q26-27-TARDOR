
apiVersion: batch/v1

kind: CronJob

metadata:

  name: scrapper-mercadona

  namespace: scrappers

spec:

  schedule: "0 2 * * *"

  timeZone: "Europe/Madrid"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 2

  failedJobsHistoryLimit: 2

  jobTemplate:

    spec:

      backoffLimit: 2

      template:

        spec:

          restartPolicy: OnFailure

          volumes:

            - name: out

              persistentVolumeClaim:

                claimName: scraper-out

          containers:

            - name: scraper

              image: scrapper-mercadona:v1

              imagePullPolicy: IfNotPresent

              envFrom:

                - secretRef:

                    name: scraper-secrets

              env:

                - name: NATS_URL

                  value: "nats://nats.messaging.svc.cluster.local:4222"

                # Codigos postales (separados por comas). Los dara la API; de momento uno de ejemplo.
                # Con Terraform se sobrescribe con la variable `postal_codes`.
                - name: SCRAPER_POSTAL_CODES

                  value: "08016"

              volumeMounts:

                - name: out

                  mountPath: /app/out

              resources:

                requests: { cpu: "100m", memory: "128Mi" }

                limits:   { cpu: "500m", memory: "512Mi" }

