# Scraper de Condis (API JSON del buscador Empathy.co): todo el catalogo (~7.800 productos)
# en ~20 peticiones.
# Proyecto academico sin animo de lucro: una pasada nocturna, peticiones de una en una y
# SCRAPER_DELAY segundos entre peticiones (con 3 s, poco mas de 1 minuto).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrapper-condis
  namespace: scrappers
spec:
  schedule: "0 2 * * *"
  timeZone: "Europe/Madrid"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: out
              persistentVolumeClaim:
                claimName: scraper-out
          containers:
            - name: scraper
              image: scrapper-condis:v1
              imagePullPolicy: IfNotPresent
              env:
                - name: NATS_URL
                  value: "nats://nats.messaging.svc.cluster.local:4222"
                # Codigos postales (separados por comas). Los dara la API; de momento uno de ejemplo.
                # Con Terraform se sobrescribe con la variable `postal_codes`.
                - name: SCRAPER_POSTAL_CODES
                  value: "08016"
                - name: SCRAPER_DELAY
                  value: "3"
                # Tienda de Condis (la que ve la web sin iniciar sesion).
                - name: SCRAPER_STORE
                  value: "718"
              volumeMounts:
                - name: out
                  mountPath: /app/out
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits:   { cpu: "500m", memory: "768Mi" }
