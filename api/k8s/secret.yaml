# Credencials de desenvolupament. Cal canviar-les abans de desplegar fora de local.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  POSTGRES_USER: pti
  POSTGRES_PASSWORD: pti
  POSTGRES_DB: precios
  DATABASE_URL: postgresql+psycopg://pti:pti@postgres:5432/precios
  # Clau de /embed de la IA (capçalera X-API-Key). NO la poseu aquí (aquest fitxer és al repo)
  # i no hi afegiu el camp: si fos al manifest, cada `kubectl apply -k` la tornaria a buidar.
  # Al clúster:
  #   kubectl -n api patch secret api-secrets --type merge \
  #     -p '{"stringData":{"RAG_EMBED_API_KEY":"<clau>"}}'
  #   kubectl -n api rollout restart deploy/api deploy/writer
