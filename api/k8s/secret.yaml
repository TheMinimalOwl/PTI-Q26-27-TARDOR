# Credencials de desenvolupament. Cal canviar-les abans de desplegar fora de local.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  POSTGRES_USER: pti
  POSTGRES_PASSWORD: pti
  POSTGRES_DB: precios
  DATABASE_URL: postgresql+psycopg://pti:pti@postgres:5432/precios
  # Clau de /embed de la IA (capçalera X-API-Key). NO la poseu aquí (aquest fitxer és al repo):
  # al clúster, kubectl -n api patch secret api-secrets --type merge \n  #   -p '{"stringData":{"RAG_EMBED_API_KEY":"<clau>"}}'
  RAG_EMBED_API_KEY: ""
