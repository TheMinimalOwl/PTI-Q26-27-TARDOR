apiVersion: apps/v1
kind: Deployment
metadata:
  name: flujo-ia
  namespace: ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flujo-ia
  template:
    metadata:
      labels:
        app: flujo-ia
    spec:
      containers:
        - name: flujo-ia
          image: flujo-ia:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: RAG_EMBED_MODEL
              value: e5-small
            # none = solo retrieval. Para usar el LLM local, el servicio
            # necesita la URL de Ollama (que corre en la VM, fuera del
            # clúster): ver docs/04-despliegue.md.
            - name: RAG_LLM
              value: none
            - name: OLLAMA_HOST
              value: http://host.docker.internal:11434
          envFrom:
            - secretRef:
                name: ia-secrets
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2000m", memory: "4Gi" }
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: flujo-ia
  namespace: ia
spec:
  selector:
    app: flujo-ia
  ports:
    - name: http
      port: 80
      targetPort: 8080
