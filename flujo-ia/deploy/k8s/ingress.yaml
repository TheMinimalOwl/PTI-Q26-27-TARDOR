apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flujo-ia-ingress
  namespace: ia
spec:
  ingressClassName: nginx
  rules:
    - host: rag.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flujo-ia
                port:
                  number: 80
