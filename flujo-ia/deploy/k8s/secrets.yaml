apiVersion: v1
kind: Secret
metadata:
  name: ia-secrets
  namespace: ia
type: Opaque
stringData:
  # Clave de AI Studio (https://aistudio.google.com/apikey). Solo hace falta si
  # se usa el LLM por API (RAG_LLM=gemini). Con el LLM local no hace falta
  # ninguna clave.
  #
  # NO subir una clave real al repo: este fichero esta aqui como plantilla.
  # En la maquina, crear el secret con:
  #   kubectl create secret generic ia-secrets -n ia \
  #     --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY"
  GEMINI_API_KEY: ""
